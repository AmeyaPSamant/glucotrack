<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GlucoTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            Gluco<span>Track</span>
        </a>
        <div class="user-nav">
            <a href="login.html" class="btn btn-outline">Already registered? Log In</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">Choose a unique username to store your glucose data.</p>

            <div id="alertBox" class="alert"></div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Choose a Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. alex" required autofocus autocomplete="off">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    Register Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
                Already have an account? <a href="login.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Log In</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
