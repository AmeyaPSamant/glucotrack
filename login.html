<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GlucoTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            Gluco<span>Track</span>
        </a>
        <div class="user-nav">
            <a href="register.html" class="btn btn-outline">Need an account? Register</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your username to access your diabetes logs.</p>

            <div id="alertBox" class="alert"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. alex" required autofocus autocomplete="off">
                    <small style="color: #64748b; font-size: 0.8rem; margin-top: 0.3rem; display: block;">
                        *No password required. System checks if username exists in SQL database.
                    </small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    Log In
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
                Don't have an account yet? <a href="register.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Register here</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (localStorage.getItem('glucotrack_user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
